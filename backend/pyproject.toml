# Configuração do ruff (lint e formatação), usada também pela extensão do VS Code.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# RUF012: listas como atributos de classe (list_display, permission_classes...) são o padrão do Django/DRF.
ignore = ["RUF012"]
